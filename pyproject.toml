[project]
name = "project-gyaan"
version = "0.1.0"
description = "Personal intelligence digest — agentic pipeline for article curation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langsmith>=0.1.0",
    "typing-extensions>=4.10.0",
    "openai>=1.50.0",
    "tavily-python>=0.5.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.8.0",
    "requests>=2.31.0",
    "markdown>=3.5.0",
    "feedparser>=6.0.0",
]


[dependency-groups]
dev = []
